  "paths": {
    "/apps/v0/vpp": {
      "get": {
        "security": [
          {
            "apiKey": []
          }
        ],
        "summary": "Get VPP License List",
        "description": "API to get a list of VPP licenses with the given VPP token",
        "tags": [
          "4_VPP License Management"
        ],
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "code": {
                      "type": "integer",
                      "description": "response code",
                      "default": 200
                    },
                    "message": {
                      "type": "string",
                      "description": "response message"
                    },
                    "content": {
                      "type": "object",
                      "properties": {
                        "count": {
                          "type": "integer",
                          "description": "number of results returned"
                        },
                        "prev": {
                          "type": "string",
                          "description": "URL for previous page of results"
                        },
                        "next": {
                          "type": "string",
                          "description": "URL for next page of results"
                        },
                        "results": {
                          "type": "array",
                          "items": {
                            "oneOf": [
                              {
                                "$ref": "#/components/schemas/VPPLicense"
                              }
                            ]
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          },
          "401": {
            "description": "Unauthorized",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error_401_Unauthorized"
                }
              }
            }
          },
          "500": {
            "description": "Internal Server Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error_500_Internal_Server_Error"
                }
              }
            }
          }
        }
      }
    },
    "/apps/v0/vpp/{appId}": {
      "get": {
        "security": [
          {
            "apiKey": []
          }
        ],
        "parameters": [
          {
            "in": "path",
            "name": "appId",
            "schema": {
              "type": "integer"
            },
            "required": true
          }
        ],
        "summary": "Get VPP License Info about an App",
        "description": "API to get information about the VPP license for a given app",
        "tags": [
          "4_VPP License Management"
        ],
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "code": {
                      "type": "integer",
                      "description": "response code",
                      "default": 200
                    },
                    "message": {
                      "type": "string",
                      "description": "response message"
                    },
                    "content": {
                      "$ref": "#/components/schemas/VPPLicense"
                    }
                  }
                }
              }
            }
          },
          "401": {
            "description": "Unauthorized",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error_401_Unauthorized"
                }
              }
            }
          },
          "500": {
            "description": "Internal Server Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error_500_Internal_Server_Error"
                }
              }
            }
          }
        }
      }
    }
