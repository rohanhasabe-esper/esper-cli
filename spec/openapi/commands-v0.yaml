          },
          "locale": {
            "type": "string",
            "description": "Language and country code in xx[_Zzzz]_yy where xx is language code, Zzzz is script (optional) and yy is country code."
          },
          "ethernet_auth_mode": {
            "type": "string",
            "description": "Chosen mode of authentication",
            "enum": [
              "NONE",
              "EAP_TLS"
            ]
          },
          "ethernet_ca_cert_alias": {
            "type": "string",
            "description": "CA certificate alias. It is mandatory with Auth Mode EAP_TLS"
          },
          "ethernet_client_cert_alias": {
            "type": "string",
            "description": "Client certificate alias. It is mandatory with Auth Mode EAP_TLS"
          },
          "ethernet_eap_identity": {
            "type": "string",
            "description": "EAP identity"
          },
          "interface": {
            "type": "string",
            "description": "The network interface of the device - wlan/eth"
          },
          "dhcp_enabled": {
            "type": "string",
            "description": "The dhcp state on the device - true/false"
          },
          "static_ip": {
            "type": "string",
            "description": "The static ip to set on the device. Should be a valid ipv4"
          },
          "primary_dns": {
            "type": "string",
            "description": "The primary dns to set on the device. Should be a valid ipv4"
          },
          "subnet_mask": {
            "type": "string",
            "description": "The subnet mask set on the device. Should between 1-32 both inclusive"
          },
          "secondary_dns": {
            "type": "string",
            "description": "The secondary dns to set on the device. Should be a valid ipv4"
