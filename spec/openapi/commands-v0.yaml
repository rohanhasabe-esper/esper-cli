      },
      "post": {
        "summary": "Create a command request",
        "description": "API to create a command request for a set of devices or groups. Works for mixed-fleet devices (Android, iOS, etc.) if the command is supported.\n\nYou can send the command immediately or [schedule command](https://help.esper.io/hc/en-us/articles/16693582666769-Scheduling-API-Commands) for supported devices.\n\nScheduled commands are currently compatible with Android devices.",
