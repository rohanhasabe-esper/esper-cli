  "components": {
    "schemas": {
      "CommandStatus_PUT": {
        "type": "object",
        "properties": {
          "state": {
            "type": "string",
            "description": "Command state to update",
            "enum": [
              "Command Acknowledged",
              "Command In Progress",
              "Command TimeOut",
              "Command Success",
              "Command Failure",
              "Command Scheduled",
              "Command Cancelled"
            ]
          },
          "reason": {
            "type": "string",
            "description": "State change reason to update"
          }
        }
      },
      "CommandStatus": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "description": "Unique command identifier",
            "format": "uuid",
            "readOnly": true
          },
          "request": {
            "title": "Request Id",
            "type": "string",
            "description": "Request Id associated with this command",
            "format": "uuid",
            "readOnly": true
          },
          "device": {
            "title": "Device",
            "type": "string",
            "description": "Device associated with this command",
            "format": "uuid",
            "readOnly": true
          },
          "state": {
            "type": "string",
            "description": "Current state of the command",
            "enum": [
              "Command Queued",
              "Command Initiated",
              "Command Acknowledged",
              "Command In Progress",
              "Command TimeOut",
              "Command Success",
              "Command Failure",
              "Command Scheduled",
              "Command Cancelled"
            ]
          },
          "reason": {
            "type": "string",
            "description": "details briefing the reason for current command state"
          },
          "created_at": {
            "type": "string",
            "description": "Timestamp of command creation",
            "format": "date-time",
            "readOnly": true
          },
          "updated_at": {
            "type": "string",
            "description": "Last updated timestamp of command",
            "format": "date-time",
            "readOnly": true
          }
        }
      },
      "CommandRequestStats": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "readOnly": true
          },
          "status": {
            "type": "array",
            "description": "List of each command status associated to its count.",
            "items": {
              "type": "object",
              "properties": {
                "state": {
                  "type": "string",
                  "description": "State of the command",
                  "enum": [
                    "Command Queued",
                    "Command Initiated",
                    "Command Acknowledged",
                    "Command In Progress",
                    "Command TimeOut",
                    "Command Success",
                    "Command Failure",
                    "Command Scheduled",
                    "Command Cancelled"
                  ]
                },
                "total": {
                  "type": "number",
                  "description": "Count of the devices that are in the corresponding command state"
                }
              }
            }
          }
        }
      },
      "Error_404_Not_Found": {
        "type": "object",
        "properties": {
          "code": {
            "type": "integer",
            "format": "int32",
            "default": 404
          },
          "message": {
            "type": "string"
          },
          "content": {
            "type": "object"
          }
        },
        "required": [
          "code",
          "message"
        ]
      },
      "Error_400_Bad_Data": {
        "type": "object",
        "properties": {
          "code": {
            "type": "integer",
            "format": "int32",
            "default": 400
          },
          "message": {
            "type": "string"
          },
          "content": {
            "type": "object"
          }
        },
        "required": [
          "code",
          "message"
        ]
      },
      "CommandRequest_POST": {
        "type": "object",
        "properties": {
          "command_type": {
            "type": "string",
            "description": "Identifies the type of command\n\n```\n* DEVICE: command request is meant for devices\n* GROUP: command request is meant for groups\n* DYNAMIC: command request is meant for dynamic set of devices\n  i.e subset of devices from different groups or otherwise.\n```\n",
            "enum": [
              "DEVICE",
              "GROUP",
              "DYNAMIC"
            ]
          },
          "alias": {
            "type": "string",
            "description": "Another name for the command, provided by the user or Console."
          },
          "devices": {
            "maxItems": 1000,
            "minItems": 0,
            "type": "array",
            "description": "List of devices to run commands. Required if command_type is 'DEVICE' or 'DYNAMIC'",
            "items": {
              "type": "string",
              "format": "uuid"
            }
          },
          "groups": {
            "maxItems": 500,
            "minItems": 0,
            "type": "array",
            "description": "List of groups to run commands. Required if command_type is 'GROUP' or 'DYNAMIC'",
            "items": {
              "type": "string",
              "format": "uuid"
            }
          },
          "device_type": {
            "type": "string",
            "description": "Filtering by device_type is currently not supported. Please specify 'all'.",
            "enum": [
              "all"
            ]
          },
          "command": {
            "$ref": "#/components/schemas/DeviceCommandEnum"
          },
          "command_args": {
            "$ref": "#/components/schemas/CommandArgs"
          },
          "schedule": {
            "$ref": "#/components/schemas/CommandScheduleEnum"
          },
          "schedule_args": {
            "$ref": "#/components/schemas/CommandScheduleArgs"
          }
        }
      },
      "CommandScheduleArgs": {
        "title": "Command Schedule Arguments",
        "type": "object",
        "properties": {
          "name": {
            "type": "string"
          },
          "start_datetime": {
            "type": "string",
            "format": "date-time"
          },
          "end_datetime": {
            "type": "string",
            "format": "date-time"
          },
          "time_type": {
            "$ref": "#/components/schemas/CommandScheduleArgsTimeTypeEnum"
          },
          "window_start_time": {
            "type": "string"
          },
          "window_end_time": {
            "type": "string"
          },
          "days": {
            "type": "array",
            "items": {
              "type": "string"
            }
          }
        }
      },
      "CommandScheduleArgsTimeTypeEnum": {
        "type": "string",
        "description": "The Time-Type argument, in Schedule args, is to indicate which timezone the Command Framework should utilize when scheduling the command.\nFollowing Schedule Args for Time-Type are supported:\n```\n* CONSOLE: Use the local timezone of the user creating the schedule.\n* DEVICE: Use the local timezone of the device, to which the command is issued, wherever it may be.\n```\n",
        "enum": [
          "console",
          "device"
        ]
      },
      "CommandScheduleEnum": {
        "type": "string",
        "description": "Following Schedule types are supported\n```\n* IMMEDIATE: Schedule the command to execcute Immediately\n* WINDOW: Schedule the command to execute within the given window\n* RECURRING: Schedule the command to execute during the scheduled time until it succeeds or expires. After executing successfully, it will not fire again.\n```\n",
        "enum": [
          "IMMEDIATE",
          "WINDOW",
          "RECURRING"
        ]
      },
      "CommandArgs": {
        "title": "Command args",
        "type": "object",
        "properties": {
          "device_alias_name": {
            "type": "string",
            "description": "Alternate human-readable name for your Device"
          },
          "custom_settings_config": {
            "type": "object",
            "properties": {},
            "description": "Managed configurations for your device (passed as JSON object)"
          },
          "app_version": {
            "type": "string",
            "description": "The version id of app uploaded on Esper"
          },
          "package_name": {
            "type": "string",
            "description": "The app package name uploaded on Esper"
          },
          "policy_url": {
            "type": "string",
            "description": "The URL to the policy"
          },
          "wifi_access_points": {
            "type": "object",
            "properties": {},
            "description": "Wifi access points for the device (passed as JSON object)"
          },
          "state": {
            "type": "string",
            "description": "LOCKED/UNLOCKED"
          },
          "message": {
            "type": "string",
            "description": "Message to be added with command to notify device."
          },
          "title": {
            "type": "string",
            "description": "Message title  to be added with command to notify device."
          },
          "url": {
            "type": "string",
            "description": "(Optional) Link to notify device."
          },
          "app_state": {
            "type": "string",
            "description": "The state of app - SHOW/HIDE/DISABLE/LAUNCHABLE_BUT_HIDDEN"
          },
          "bluetooth_state": {
            "type": "boolean",
            "description": "The state of bluetooth - ON/OFF"
          },
          "brightness_value": {
            "type": "integer",
            "description": "The brightness value of a device(1-100)"
          },
          "gps_state": {
            "type": "integer",
            "description": "The GPS state of a device. Should be either 0, 1, 2, 3 or 4 (LOCATION_MODE_HIGH_ACCURACY = 0, LOCATION_MODE_SENSORS_ONLY = 1, LOCATION_MODE_BATTERY_SAVING = 2, LOCATION_MODE_OFF = 3, LOCATION_MODE_ON = 4)"
          },
          "rotate_state": {
            "type": "integer",
            "description": "The screen orientation of a device. Should be either 0, 1 or 2 (0 = AUTO, 1 = PORTRAIT_ONLY, 2 = LANDSCAPE_ONLY)"
          },
          "screen_off_timeout": {
            "type": "integer",
            "description": "The value for screen timeout of a device. Should be either -1 or between 5000 and 1800000"
          },
          "stream": {
            "type": "integer",
            "description": "The value of the volume stream. Should be either 0(Ring), 1(Notification), 2(Alarm) or 3(Music)"
          },
          "volume_level": {
            "type": "integer",
            "description": "The level of volume. Should be a value from 0 to 100"
          },
          "timezone_string": {
            "type": "integer",
            "description": "The timezone of a device. Should be a valid timezone string"
          },
          "wifi_state": {
            "type": "boolean",
            "description": "The state of WIFI - ON/OFF"
          },
          "wifi_revert_timeout": {
            "type": "integer",
