      "CommandRequest": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "description": "Unique command request identifier",
            "format": "uuid",
            "readOnly": true
          },
          "command_type": {
            "type": "string",
            "description": "Identifies the type of command\n\n```\n* DEVICE: command request is meant for devices\n* GROUP: command request is meant for groups\n* DYNAMIC: command request is meant for dynamic set of devices\n  i.e subset of devices from different groups or otherwise.\n```\n",
            "enum": [
              "DEVICE",
              "GROUP",
              "DYNAMIC"
            ]
          },
          "devices": {
            "maxItems": 1000,
            "minItems": 0,
            "type": "array",
            "description": "list of devices to run commands",
            "items": {
              "type": "string",
              "format": "uuid"
            }
          },
          "groups": {
            "maxItems": 500,
            "minItems": 0,
            "type": "array",
            "description": "list of groups to run commands",
            "items": {
              "type": "string",
              "format": "uuid"
            }
          },
          "device_type": {
            "type": "string",
            "description": "Filtering by device_type is not supported currently and applies to 'all' devices. If 'active' or 'inactive' is specified, it will be ignored.",
            "default": "active",
            "enum": [
              "active",
              "inactive",
              "all"
            ]
          },
          "command": {
            "$ref": "#/components/schemas/DeviceCommandEnum"
          },
          "command_args": {
            "$ref": "#/components/schemas/CommandArgs"
          },
          "schedule": {
            "$ref": "#/components/schemas/CommandScheduleEnum"
          },
          "schedule_args": {
            "$ref": "#/components/schemas/CommandScheduleArgs"
          },
          "reason": {
            "type": "string",
            "description": "details briefing the reason for current command request processing stage"
          },
          "created_by": {
            "type": "string",
            "description": "user id of the user",
            "readOnly": true
          },
          "created_at": {
            "type": "string",
            "description": "Timestamp of command request",
            "format": "date-time",
            "readOnly": true
          }
        }
      }
    },
    "securitySchemes": {
      "apiKey": {
        "type": "http",
        "scheme": "bearer",
        "description": "#### API KEY - Access Token\nAccess token for API is passed as authorization header in calls. You need to generate this from your Esper Console at `<domain>-api.esper.cloud` where foo is the sub-domain name you gave for your Esper Dev environment when you signed up for your Esper account. Please follow the instructions [in this Help article](https://help.esper.io/hc/en-us/articles/12656959508497) to generate an access token.\nOnce you have the access token, you need to send an authorization header as below\n\n```bash\n\n    curl -X GET \\\n      https://<domain>-api.esper.cloud/api/enterprise/<enterprise_id>/device/ \\\n      -H 'Authorization: Bearer <ACCESS_TOKEN>' \\\n      -H 'Content-Type: application/json' \\\n```\n\n> Please note the use of keyword **Bearer** before the token value.\n\n\nYou can read more about api key authentication [here](https://help.esper.io/hc/en-us/articles/12656959508497).\n"
      }
    }
  }
}
