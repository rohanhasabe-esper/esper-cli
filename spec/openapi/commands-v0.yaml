                    "code": {
                      "type": "integer"
                    },
                    "message": {
                      "type": "string"
                    },
                    "content": {
                      "type": "object",
                      "properties": {
                        "count": {
                          "type": "integer"
                        },
                        "previous": {
                          "type": "string"
