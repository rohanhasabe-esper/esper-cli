          "gateway": {
            "type": "string",
            "description": "The gateway to set on the device. Should be a valid ipv4"
          },
          "duration": {
            "type": "string",
            "description": "The beep duration specified in seconds. Value must be between 10 and 300, both inclusive."
          },
          "video_quality": {
            "type": "string",
            "default": "HIGH",
            "description": "The video quality of the respective Remote Viewer session. Options are \"LOW\", \"MEDIUM\" and \"HIGH\"."
          },
          "enable_debug_mode": {
            "type": "boolean",
            "default": false,
            "description": "The flag to determine whether device must go into Debug Mode, in order to retreive bug report when the device is already in Kiosk Mode."
          },
          "app_id": {
            "type": "string",
            "description": "The unique identifier for VPP application in Apple’s ecosystem"
          },
          "bundle_identifier": {
            "type": "string",
            "description": "The unique identifier for an application in Apple’s ecosystem"
          },
          "managed_only": {
            "type": "boolean",
            "description": "If true, list outs only the profiles that was installed via MDM."
          },
          "profile_identifier": {
            "type": "string",
            "description": "The identifier of the profile to remove."
          },
          "profile": {
            "type": "string",
            "description": "Base 64 encoded profile plist to be installed on the device."
          },
          "is_converge": {
            "type": "boolean",
            "description": "This value indicates that the command belongs to a converge action."
          },
          "script": {
            "type": "string",
            "description": "A complete shell script to execute on Linux or Windows devices."
          },
          "interpreter": {
            "type": "string",
            "description": "Type of interpreter to use for executing the script. e.g. For Linux use bash, zsh, or sh. For Windows use powershell. This field is mandatory."
          },
          "execute_as": {
            "type": "string",
            "description": "User to execute the script as root or Esper (default user) - Optional, default is Esper if not specified. Supports Linux devices."
          },
          "cert_file_type": {
            "type": "string",
            "description": "Certificate file type. Currently file type of \"pkcs12\" is supported"
