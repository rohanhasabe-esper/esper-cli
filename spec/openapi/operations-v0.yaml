  "paths": {
    "/v0/operations/": {
      "get": {
        "summary": "Get all Operations in the Tenant",
        "operationId": "getOperationsList",
        "tags": [
          "3_Operations"
        ],
        "security": [
          {
            "apiKey": []
          }
        ],
        "parameters": [
          {
            "in": "query",
            "name": "limit",
            "schema": {
              "type": "integer"
            }
          },
          {
            "in": "query",
            "name": "offset",
            "schema": {
              "type": "integer"
            }
          },
          {
            "in": "query",
            "name": "state",
            "schema": {
              "type": "integer"
            },
            "description": "Following are the Operation States and their corresponding integer values\n```\nOPERATION_CREATED      = 10\nOPERATION_RESOLVING    = 20\nOPERATION_RESOLVED     = 30\nOPERATION_DISPATCHING  = 40\nOPERATION_DISPATCHED   = 50\nOPERATION_PROCESSING   = 60\nOPERATION_COMPLETED    = 70\nOPERATION_SUCCESS      = 80\nOPERATION_FAILURE      = 90\nOPERATION_SCHEDULED    = 100\nOPERATION_CANCELLED    = 110\nOPERATION_TIMEOUT      = 120\n```\n"
          },
          {
            "in": "query",
            "name": "ordering",
            "description": "Field to order the results by. Prefix with '-' to reverse the order.",
            "schema": {
              "type": "string",
              "enum": [
                "created_at",
                "state",
                "updated_at"
              ]
            }
          },
          {
            "in": "query",
            "name": "operation_type",
            "description": "Filter operations by type (e.g., INSTALL, UNINSTALL, CONVERGE, INSTALL_APP, UNINSTALL_APP, REBOOT)",
            "schema": {
              "type": "string"
            }
          },
          {
            "in": "query",
            "name": "group_multi",
            "description": "Filter by multiple group ID. Fetch the devices from groups matching with the IDs and its subgroup.",
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ],
        "x-scope": [
          "read:operation"
        ],
        "responses": {
          "200": {
            "description": "Operations information for the Tenant",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "content": {
                      "type": "object",
                      "properties": {
                        "count": {
                          "type": "integer"
                        },
                        "previous": {
                          "type": "string"
                        },
                        "next": {
                          "type": "string"
                        },
                        "results": {
                          "type": "array",
                          "items": {
                            "$ref": "#/components/schemas/OperationWithStats"
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      },
      "post": {
        "summary": "Create a new Operation",
        "operationId": "createOperation",
        "tags": [
          "3_Operations"
        ],
        "security": [
          {
            "apiKey": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/Operations_POST"
              },
              "examples": {
                "devices": {
                  "$ref": "#/components/examples/example_devices"
                },
                "filters": {
                  "$ref": "#/components/examples/example_filters"
                }
              }
            }
          }
        },
        "x-scope": [
          "create:operation:CONVERGE"
        ],
        "responses": {
          "201": {
            "description": "Operation information for the Tenant",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "content": {
                      "$ref": "#/components/schemas/OperationWithStats"
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/v0/operations/{operationId}/": {
      "get": {
        "summary": "Get specific Operation details (Operation Status)",
        "operationId": "getOperation",
        "security": [
          {
            "apiKey": []
          }
        ],
        "tags": [
          "3_Operations"
        ],
        "parameters": [
          {
            "name": "operationId",
            "in": "path",
            "description": "ID of the Operation",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ],
        "x-scope": [
          "read:operation"
        ],
        "responses": {
          "200": {
            "description": "Operation information for the Tenant",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "content": {
                      "$ref": "#/components/schemas/OperationWithStats"
                    }
                  }
                }
              }
            }
          }
        }
      },
      "put": {
        "summary": "Update the operation (Support status update as of now)",
        "description": "This API allows updating the status of a specific operation by providing the operation ID.",
        "tags": [
          "3_Operations"
        ],
        "security": [
          {
            "apiKey": []
          }
        ],
        "parameters": [
          {
            "name": "operationId",
            "in": "path",
            "required": true,
            "description": "The ID of the operation to update (Put created operationId here)",
            "schema": {
              "type": "string",
              "example": "5743470f-7dcc-4a92-8a4b-f41b1cea69ed"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "state": {
                    "type": "string",
                    "enum": [
                      "FAILED",
                      "CANCELLED",
                      "TIMEOUT",
                      "SCHEDULED"
                    ],
                    "description": "The new status of the operation"
                  }
                },
                "required": [
                  "status"
                ]
              },
              "examples": {
                "example-1": {
                  "summary": "Update status to CANCELLED",
                  "value": {
                    "state": "CANCELLED",
                    "reason": "User requested"
                  }
                }
              }
            }
          }
        },
        "x-scope": [
          "update:operation"
        ],
        "responses": {
          "200": {
            "description": "Operation status updated successfully",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "operationId": {
                      "type": "string",
                      "description": "The ID of the updated operation"
                    },
                    "status": {
                      "type": "string",
                      "description": "The updated status of the operation"
                    }
                  }
                },
                "example": {
                  "operationId": "12345",
                  "status": "SUCCEEDED"
                }
              }
            }
          }
        }
      }
    },
